name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pandas openpyxl

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --windowed --icon "app_icon.ico" --name "BudgetViewer(${{ github.ref_name }})" main.py
        working-directory: ./

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BudgetViewer(${{ github.ref_name }}).exe
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTE_${{ github.ref_name }}.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
